; Space TFRs settings. Copy to config.ini and replace every REPLACE_WITH_... value.
; config.ini is git-ignored and read by common.inc (bot_cfg()) and the shell scripts.
; Permissions: chown root:www-data config.ini && chmod 640 config.ini
; Keep values in double quotes; they may not contain a double quote.

; MySQL/MariaDB login used by common.inc
[database]
host = "localhost"
user = "REPLACE_WITH_DATABASE_USER"
password = "REPLACE_WITH_DATABASE_PASSWORD"
name = "tfrmonitor"

; OpenAI API key
[openai]
api_key = "REPLACE_WITH_OPENAI_API_KEY"

; Google Maps Static API key, used to render map images
[google]
maps_api_key = "REPLACE_WITH_GOOGLE_MAPS_API_KEY"

; X/Twitter API keys (X posting is retired; kept for the old tweet functions)
[twitter]
consumer_key = "REPLACE_WITH_TWITTER_CONSUMER_KEY"
consumer_secret = "REPLACE_WITH_TWITTER_CONSUMER_SECRET"
access_token = "REPLACE_WITH_TWITTER_ACCESS_TOKEN"
access_token_secret = "REPLACE_WITH_TWITTER_ACCESS_TOKEN_SECRET"

; Pushbullet access token (legacy notifications)
[pushbullet]
old_token = "REPLACE_WITH_PUSHBULLET_OLD_TOKEN"
token = "REPLACE_WITH_PUSHBULLET_TOKEN"

; RocketLaunch.Live API key
[rocketlaunchlive]
api_key = "REPLACE_WITH_ROCKETLAUNCHLIVE_API_KEY"

; Facebook app id/secret and page token (fb_page_post.php, fb_forevertoken.php)
[facebook]
app_id = "REPLACE_WITH_FACEBOOK_APP_ID"
app_secret = "REPLACE_WITH_FACEBOOK_APP_SECRET"
user_access_token = "REPLACE_WITH_FACEBOOK_USER_ACCESS_TOKEN"
page_access_token = "REPLACE_WITH_FACEBOOK_PAGE_ACCESS_TOKEN"

; Mastodon token used by mastodon_2.php (tootophp library)
[tootophp]
access_token = "REPLACE_WITH_TOOTOPHP_ACCESS_TOKEN"

; Bluesky app password used by the old skeet.php
[bluesky_skeetphp]
app_password = "REPLACE_WITH_BLUESKY_SKEETPHP_APP_PASSWORD"

; Bluesky app password for skeet.sh (Settings > Privacy and security > App passwords)
[bluesky]
app_password = "REPLACE_WITH_BLUESKY_APP_PASSWORD"

; Mastodon access token for toot.sh
[mastodon]
access_token = "REPLACE_WITH_MASTODON_ACCESS_TOKEN"
